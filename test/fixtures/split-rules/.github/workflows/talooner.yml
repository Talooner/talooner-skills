name: talooner
on:
  pull_request:
  pull_request_review:
    types: [submitted]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh ghcr.io/talooner/talooner-runner:1.3.2 .talooner/test-rules.sh
  review:
    needs: rules
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: wait for the other checks on this commit
        run: echo "no checks pending"
      - uses: docker://ghcr.io/talooner/talooner-runner:1.3.2-gh
        env:
          TALOONER_LICENSE_KEY: ${{ secrets.TALOONER_LICENSE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CDM_URL: ${{ vars.CDM_URL }}
          CDM_TOKEN: ${{ secrets.CDM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
