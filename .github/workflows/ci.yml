name: ci
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x -P SCRIPTDIR talooner-onboard/scripts/*.sh talooner-onboard/assets/test-rules.sh scripts/*.sh test/run.sh
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-skill.sh
      - run: docker run --rm -v "$PWD/talooner-onboard/assets:/repo/assets:ro" -w /repo --entrypoint tln ghcr.io/talooner/talooner-runner:1.2.2 test assets/
      - run: docker run --rm -v "$PWD/test/fixtures/clean-repo/.talooner:/repo/.talooner:ro" -w /repo --entrypoint tln ghcr.io/talooner/talooner-runner:1.2.2 test .talooner/
      - run: ./test/run.sh
